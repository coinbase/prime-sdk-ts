name: Update API Spec

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Install openapi-generator-cli
        run: |
          npm install @openapitools/openapi-generator-cli -g
          ln -s "$(which openapi-generator-cli)" /usr/local/bin/openapi-generator

      - name: Resolve existing PR
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: auto/update-spec
        run: |
          # Branch name is a fixed constant. Never copy headRefName from PRs into
          # GITHUB_OUTPUT or GitHub Actions expressions — that interpolates
          # untrusted input into the shell.
          EXISTING_PR=$(gh pr list \
            --state open \
            --head "$BRANCH" \
            --json number,headRefName,headRepositoryOwner \
            --jq '[.[] | select(.headRefName == "auto/update-spec" and .headRepositoryOwner.login == "coinbase")] | .[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "has_open_pr=true" >> "$GITHUB_OUTPUT"
            echo "Using existing open PR #$EXISTING_PR on $BRANCH"
          else
            echo "has_open_pr=false" >> "$GITHUB_OUTPUT"
            echo "No open PR found; will use branch $BRANCH"
          fi

      - name: Checkout target branch
        env:
          BRANCH: auto/update-spec
          HAS_OPEN_PR: ${{ steps.branch.outputs.has_open_pr }}
        run: |
          if [ "$HAS_OPEN_PR" = "true" ]; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin main "$BRANCH"
            git checkout -B "$BRANCH" origin/main
          else
            git checkout -b "$BRANCH"
          fi

      - name: Restore package-lock.json
        run: git checkout -- package-lock.json

      - name: Run update-spec
        run: npm run update-spec

      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and open or update PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: auto/update-spec
          HAS_OPEN_PR: ${{ steps.branch.outputs.has_open_pr }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update API spec and regenerate types"
          git push -u origin "$BRANCH"

          if [ "$HAS_OPEN_PR" = "true" ]; then
            echo "Updated existing PR on branch $BRANCH"
          else
            gh pr create \
              --title "chore: update API spec and regenerate types" \
              --body "Automated update from the live OpenAPI spec at https://api.prime.coinbase.com/v1/openapi.yaml" \
              --base main \
              --head "$BRANCH"
          fi
